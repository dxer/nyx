name: nyx
description: "Nyx - Silent speed in pure darkness. A lightweight, power-efficient, OLED pure-black VPN client powered by sing-box."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Local Persistence
  shared_preferences: ^2.3.5

  # YAML Parsing for Clash / Mihomo configs
  yaml: ^3.1.3

  # Icons & Internationalization
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
