name: Build Releases (Android & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (Split Per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Release APK Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Scaffold Windows Build Files
        shell: pwsh
        run: |
          Copy-Item windows\runner\win32_window.cpp -Destination win32_window.cpp.bak
          Copy-Item windows\runner\win32_window.h -Destination win32_window.h.bak
          flutter create . --platforms=windows --org com.nyx.vpn
          Move-Item -Force win32_window.cpp.bak windows\runner\win32_window.cpp
          Move-Item -Force win32_window.h.bak windows\runner\win32_window.h

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Artifacts
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Nyx-Windows-x64.zip
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path build\windows\runner\Release\* -DestinationPath Nyx-Windows-x64.zip
          } else {
            Get-ChildItem -Recurse build\windows\
            throw "Could not locate Windows Release build directory"
          }

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Windows-x64
          path: Nyx-Windows-x64.zip

      - name: Release Windows Binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nyx-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
