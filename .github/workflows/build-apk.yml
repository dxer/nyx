name: Build Releases (Android & Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (Split Per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Nyx-Windows-x64.zip

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-Windows-x64
          path: Nyx-Windows-x64.zip
